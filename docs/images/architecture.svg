<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Plant Stock architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="998" height="538" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <text x="32" y="44" font-size="21" font-weight="700" fill="#111827">Plant Stock · architecture</text>
  <text x="32" y="68" font-size="13" fill="#6b7280">Each site (staging, production) is its own Docker Compose stack on a small Google Cloud VM</text>

  <!-- Left: staff and GitHub -->
  <rect x="30" y="130" width="200" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="46" y="156" font-size="15" font-weight="700" fill="#14532d">Nursery staff</text>
  <text x="46" y="178" font-size="12.5" fill="#374151">Phone-first React app</text>
  <text x="46" y="196" font-size="12.5" fill="#374151">camera barcode scanning</text>
  <text x="46" y="214" font-size="12.5" fill="#374151">photo uploads</text>
  <text x="46" y="232" font-size="12.5" fill="#374151">Bluetooth label printing</text>

  <rect x="30" y="330" width="200" height="160" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="46" y="356" font-size="15" font-weight="700" fill="#111827">GitHub Actions</text>
  <text x="46" y="378" font-size="12.5" fill="#374151">CI on every pull request:</text>
  <text x="46" y="396" font-size="12.5" fill="#374151">gofmt · vet · sqlc diff</text>
  <text x="46" y="414" font-size="12.5" fill="#374151">Go tests on real Postgres</text>
  <text x="46" y="432" font-size="12.5" fill="#374151">lint · build · Docker images</text>
  <text x="46" y="456" font-size="12.5" fill="#374151">Deploys on merge to staging,</text>
  <text x="46" y="474" font-size="12.5" fill="#374151">keyless (Workload Identity)</text>

  <!-- VM -->
  <rect x="270" y="90" width="430" height="420" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="290" y="114" font-size="13" font-weight="600" fill="#475569">Google Cloud VM · Docker Compose</text>

  <rect x="295" y="130" width="180" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="311" y="156" font-size="15" font-weight="700" fill="#1e3a8a">Caddy</text>
  <text x="311" y="177" font-size="12.5" fill="#374151">automatic HTTPS</text>

  <rect x="505" y="130" width="170" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="521" y="156" font-size="15" font-weight="700" fill="#1e3a8a">Web</text>
  <text x="521" y="177" font-size="12.5" fill="#374151">nginx · React + TypeScript</text>

  <rect x="295" y="240" width="180" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="311" y="266" font-size="15" font-weight="700" fill="#1e3a8a">API · Go + Gin</text>
  <text x="311" y="287" font-size="12.5" fill="#374151">permission checks</text>
  <text x="311" y="305" font-size="12.5" fill="#374151">type-safe SQL (sqlc)</text>

  <rect x="505" y="240" width="170" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="521" y="266" font-size="15" font-weight="700" fill="#1e3a8a">Worker · Go</text>
  <text x="521" y="287" font-size="12.5" fill="#374151">Shopify sync jobs</text>
  <text x="521" y="305" font-size="12.5" fill="#374151">nightly drift check</text>

  <rect x="295" y="380" width="380" height="110" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="311" y="406" font-size="15" font-weight="700" fill="#78350f">PostgreSQL 17</text>
  <text x="311" y="427" font-size="12" fill="#374151">Row-Level Security keeps each nursery's rows apart</text>
  <text x="311" y="444" font-size="12" fill="#374151">Triggers write plant history (who, when; never edited)</text>
  <text x="311" y="461" font-size="12" fill="#374151">jobs table is the queue (leases, retries, safe to rerun)</text>
  <text x="311" y="478" font-size="12" fill="#374151">Nightly backups to Cloud Storage, tested restores</text>

  <!-- Right: external services -->
  <rect x="750" y="110" width="220" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="766" y="136" font-size="15" font-weight="700" fill="#4c1d95">Clerk</text>
  <text x="766" y="157" font-size="12.5" fill="#374151">sign-in, invite-only</text>

  <rect x="750" y="190" width="220" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="766" y="216" font-size="15" font-weight="700" fill="#4c1d95">Cloud Storage</text>
  <text x="766" y="237" font-size="12.5" fill="#374151">photos, short-lived signed links</text>

  <rect x="750" y="270" width="220" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="766" y="296" font-size="15" font-weight="700" fill="#4c1d95">Resend</text>
  <text x="766" y="317" font-size="12.5" fill="#374151">transactional email (SMTP)</text>

  <rect x="750" y="350" width="220" height="88" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="766" y="376" font-size="15" font-weight="700" fill="#4c1d95">Shopify Admin API</text>
  <text x="766" y="397" font-size="12.5" fill="#374151">each nursery's own store (OAuth)</text>
  <text x="766" y="415" font-size="12.5" fill="#374151">products and stock out; orders,</text>
  <text x="766" y="431" font-size="12.5" fill="#374151">returns in by webhook</text>

  <rect x="750" y="460" width="220" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="766" y="482" font-size="15" font-weight="700" fill="#14532d">Shoppers</text>
  <text x="766" y="500" font-size="12.5" fill="#374151">buy online, pick up at the nursery</text>

  <!-- Flows -->
  <g stroke="#4b5563" stroke-width="1.6" fill="none">
    <line x1="230" y1="162" x2="293" y2="162" marker-end="url(#arrow)"/>
    <line x1="475" y1="162" x2="503" y2="162" marker-end="url(#arrow)"/>
    <path d="M590,194 V214 H385 V238" marker-end="url(#arrow)"/>
    <line x1="385" y1="330" x2="385" y2="378" marker-end="url(#arrow)"/>
    <line x1="590" y1="330" x2="590" y2="378" marker-end="url(#arrow)"/>
    <line x1="230" y1="410" x2="268" y2="410" marker-end="url(#arrow)"/>
    <line x1="700" y1="142" x2="748" y2="142" marker-end="url(#arrow)"/>
    <line x1="700" y1="222" x2="748" y2="222" marker-end="url(#arrow)"/>
    <line x1="700" y1="302" x2="748" y2="302" marker-end="url(#arrow)"/>
    <line x1="702" y1="390" x2="748" y2="390" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="860" y1="460" x2="860" y2="440" marker-end="url(#arrow)"/>
  </g>
  <text x="250" y="154" font-size="10.5" fill="#6b7280" text-anchor="middle">HTTPS</text>
  <text x="482" y="209" font-size="11" fill="#6b7280">/api</text>
  <text x="393" y="360" font-size="11" fill="#6b7280">queries</text>
  <text x="598" y="360" font-size="11" fill="#6b7280">claims jobs</text>
  <text x="249" y="402" font-size="10.5" fill="#6b7280" text-anchor="middle">deploy</text>
</svg>

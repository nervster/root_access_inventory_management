# sqlc turns the SQL in internal/db/queries into typed Go functions in internal/db.
# After changing a query or migration, run from backend/:  go tool sqlc generate
version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true # nullable columns become pointers (*string), nil = NULL
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true

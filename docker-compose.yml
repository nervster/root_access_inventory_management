# Local development services.
#   docker compose up -d                 → Postgres, Valkey, photo storage, Mailpit (run Go and Vite on your Mac)
#   docker compose --profile app up -d   → also builds and runs the backend + frontend containers
name: nms

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nms
      POSTGRES_DB: nms
      POSTGRES_PASSWORD: nms_dev # dev-only password
    ports:
      - "5433:5432" # 5432 is taken by Homebrew Postgres 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nms -d nms"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache (Redis-compatible, open-source fork of Redis).
  valkey:
    image: valkey/valkey:9.1-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Plant photos: SeaweedFS, an S3-compatible stand-in for Google Cloud Storage (S3 API on :8333).
  storage:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.port=8333 -dir=/data -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Catches all email the app sends (SMTP on :1025) and shows it at http://localhost:8025. Nothing is delivered.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "1025:1025"
      - "8025:8025"

  # ── App containers (same images as production) ──────────────────────────
  backend:
    profiles: [app]
    build: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://nms:nms_dev@postgres:5432/nms?sslmode=disable # dev-only password
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY} # from the git-ignored .env
      APP_URL: http://localhost:8081 # the web container below
      SMTP_ADDR: mailpit:1025
      STORAGE_ENDPOINT: http://storage:8333 # the API reaches the storage stand-in inside Docker…
      STORAGE_PUBLIC_ENDPOINT: http://localhost:8333 # …browsers on your Mac
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-} # from the git-ignored .env
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
      SHOPIFY_TOKEN_KEY: ${SHOPIFY_TOKEN_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_started
      storage:
        condition: service_healthy

  # Background jobs (same image as the backend, running /worker).
  worker:
    profiles: [app]
    build: ./backend
    entrypoint: ["/worker"]
    environment:
      DATABASE_URL: postgres://nms:nms_dev@postgres:5432/nms?sslmode=disable # dev-only password
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      APP_URL: http://localhost:8081
      STORAGE_ENDPOINT: http://storage:8333 # photos, to upload to Shopify
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
      SHOPIFY_TOKEN_KEY: ${SHOPIFY_TOKEN_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY} # from the git-ignored .env
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "8081:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  storage_data:
  valkey_data:

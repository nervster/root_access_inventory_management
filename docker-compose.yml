services:
  postgres:
    image: postgres:17
    container_name: root_access_inventory_db
    environment:
      POSTGRES_USER: inventory
      POSTGRES_DB: inventory
      POSTGRES_PASSWORD: inventory_dev # dev-only password
    ports:
      - "5433:5432"
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inventory_pgdata:

# Deploys each merge into staging to https://stock-staging.rootaccesshtx.com (deploy/deploy.sh staging).
# Signs in to Google without a stored key (set up once with deploy/setup-github-deploy.sh staging); the
# variables below are in GitHub → Settings → Environments → staging. Secrets stay on the VM.
name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch: # "Run workflow" button, for redeploying by hand

concurrency:
  group: deploy-staging
  cancel-in-progress: false # let a running deploy finish; the next one waits

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for the token Google checks
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # gcloud's IAP tunnel uploads several times faster with NumPy (it's slow without it). It has to go into the
      # Python gcloud runs on, which isn't the system one (Google's docs: IAP TCP forwarding, upload bandwidth).
      # --break-system-packages is the fallback for when that Python is the runner's own (pip refuses otherwise).
      - name: Install NumPy for the IAP tunnel
        run: |
          python="$(gcloud info --format='value(basic.python_location)')"
          echo "gcloud runs on $python"
          "$python" -m pip install --quiet numpy || "$python" -m pip install --quiet --user --break-system-packages numpy
          "$python" -c 'import numpy; print("NumPy", numpy.__version__)'

      - name: Deploy
        run: deploy/deploy.sh staging
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          CLOUDSDK_PYTHON_SITEPACKAGES: "1" # lets gcloud see NumPy if it went into the user site-packages
